    <style>
      /* Hallmark · v2.0.0 · theme: modern-minimal · mobile-first craft */
      :root {
        --d-border: #e4e4e7;
        --d-grid: #e4e4e7;
        --bg-page: #ffffff;
        --text-primary: #09090b;
        --text-secondary: #52525b;
        --font-sans: "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-hand: "Caveat", cursive;
      }

      /* Hallmark Floor 4: overflow-x: clip on html and body. Never hidden, never 100vw. */
      html, body {
        overflow-x: clip;
        max-width: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Hallmark Touch & Mobile Ergonomics */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      button, a, input, select, textarea {
        touch-action: manipulation;
      }
      button:focus-visible, a:focus-visible, input:focus-visible {
        outline: 2px solid #18181b;
        outline-offset: 2px;
      }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      html { scroll-behavior: smooth; }

      .font-hand {
        font-family: var(--font-hand);
      }

      /* Text Background Highlighter Pen effects */
      .highlight-yellow {
        background: linear-gradient(104deg, rgba(254, 240, 138, 0.95) 0%, rgba(253, 224, 71, 0.75) 100%);
        padding: 0.1em 0.35em;
        border-radius: 0.25em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        color: #09090b;
      }
      .highlight-green {
        background: linear-gradient(104deg, rgba(187, 247, 208, 0.9) 0%, rgba(134, 239, 172, 0.75) 100%);
        padding: 0.1em 0.35em;
        border-radius: 0.25em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        color: #064e3b;
      }
      .highlight-orange {
        background: linear-gradient(104deg, rgba(254, 215, 170, 0.9) 0%, rgba(253, 186, 116, 0.75) 100%);
        padding: 0.1em 0.35em;
        border-radius: 0.25em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        color: #7c2d12;

      .highlight-blue {

        padding: 0.1em 0.35em;
        border-radius: 0.25em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        color: #1e3a8a;
      }

      /* Playful cursive wiggle animation */
      @keyframes wiggle {
        0%, 100% { transform: rotate(-2.5deg); }
        50% { transform: rotate(2.5deg); }
      }
      .animate-wiggle {
        display: inline-block;
        animation: wiggle 2.8s ease-in-out infinite;
        will-change: transform;
      }

      /* Full width grid lines matching archbyshagun.in with zero mobile horizontal overflow */
      .screen-line-before {
        position: relative;
      }
      .screen-line-before::before {
        content: '';
        position: absolute;
        top: 0;
        left: -1000px;
        right: -1000px;
        height: 1px;
        background-color: var(--d-grid);
        z-index: 1;
        pointer-events: none;
      }

      .screen-line-after {
        position: relative;
      }
      .screen-line-after::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: -1000px;
        right: -1000px;
        height: 1px;
        background-color: var(--d-grid);
        z-index: 1;
        pointer-events: none;
      }

      /* Architectural crosshatch pattern matching archbyshagun */
      .crosshatch-pattern {
        position: relative;
        height: 24px;
        width: 100%;
        border-left: 1px solid var(--d-grid);
        border-right: 1px solid var(--d-grid);
        overflow: hidden;
      }
      .crosshatch-pattern::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        background-image: repeating-linear-gradient(315deg, rgba(228, 228, 231, 0.7) 0, rgba(228, 228, 231, 0.7) 1px, transparent 0, transparent 50%);
        background-size: 10px 10px;
        pointer-events: none;
      }

      /* Premium Obsidian CTA Button with micro-sheen (Hallmark Floor 2: no transition: all) */
      .btn-premium {
        background: linear-gradient(180deg, #27272a 0%, #09090b 100%);
        color: #ffffff;
        border-radius: 9999px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px rgba(0, 0, 0, 0.16);
        transition: background-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
        min-height: 44px;
        touch-action: manipulation;
      }
      .btn-premium:hover {
        background: linear-gradient(180deg, #3f3f46 0%, #18181b 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 6px 20px rgba(0, 0, 0, 0.22);
      }
      .btn-premium:active {
        transform: scale(0.97);
      }

      /* Slow breathing pulse for CTA buttons */
      @keyframes pulse-slow {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
        }
        50% {
          transform: scale(1.02);
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.26);
        }
      }
      .animate-pulse-slow {
        animation: pulse-slow 2.6s ease-in-out infinite;
        will-change: transform;
      }

      /* Hardware-accelerated subtle marquee for mobile 60/120fps */
      @keyframes scroll-left { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
      @keyframes scroll-right { 0% { transform: translate3d(-50%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
      .animate-scroll-left {
        display: flex;
        width: max-content;
        animation: scroll-left 45s linear infinite;
        will-change: transform;
      }
      .animate-scroll-right {
        display: flex;
        width: max-content;
        animation: scroll-right 45s linear infinite;
        will-change: transform;
      }
      .hover\:pause:hover, .hover\:pause:active { animation-play-state: paused; }

      /* Hallmark Floor 7: prefers-reduced-motion fallback */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

        background-color: #ffffff;
